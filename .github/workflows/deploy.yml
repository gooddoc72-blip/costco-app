name: Deploy to Server

# push마다 배포하면 그때마다 costco-app이 재시작돼 접속 중인 사용자 화면이
# 끊기고 새로고침됐다(10/1~10/8 7일간 재시작 23회, 거의 전부 낮 배포).
# → 배포는 매일 새벽 3시(KST) 한 번. 서버가 이미 최신이면 재시작하지 않는다.
#   급한 수정은 Actions › Deploy to Server › Run workflow(또는 `gh workflow run deploy.yml`)로 즉시.
on:
  schedule:
    - cron: '0 18 * * *'      # 18:00 UTC = 03:00 KST
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/costco-app
            git fetch origin main -q
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
              echo "⏭ 이미 최신 — 재시작하지 않음"
              exit 0
            fi
            git pull origin main
            /opt/costco-app/venv/bin/pip install -r requirements.txt -q
            sudo systemctl restart costco-app
            # FastAPI(/api/*)는 별도 서비스라 같이 재시작해야 새 코드가 반영된다
            sudo systemctl restart costco-api || true
            # 모바일 빌드/재시작 — mobile/ 변경 있을 때만
            if git diff --name-only HEAD@{1} HEAD 2>/dev/null | grep -q '^mobile/'; then
              cd /opt/costco-app/mobile
              npm install --silent
              npm run build
              sudo systemctl restart costco-mobile || true
              echo "📱 모바일 재배포 완료"
            fi
            echo "✅ 배포 완료"
