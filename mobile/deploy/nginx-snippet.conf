# ⚠️ 이 파일은 '전면 컷오버'용 예시다 — 실제 운영에는 적용하지 않았다.
#    적용하면 Next.js가 사이트 루트(/)를 가져가고 Streamlit이 /legacy/로 밀린다.
#
# 2026-08 실제 운영 구성: 기존 설정(/etc/nginx/sites-available/costco-app)에
#   location /m/ { proxy_pass http://127.0.0.1:3000; ... } 블록만 추가해
#   모바일 앱을 /m 하위경로에 격리했다. (basePath=/m)
#   기존 경로 /(랜딩) · /app(Streamlit) · /api/(FastAPI) · /calc/(정적앱)는 그대로다.
#   전면 컷오버를 하려면 그때 이 파일을 참고할 것.

# /etc/nginx/sites-available/costco-app
# 전 사용자(모바일+PC) → Next.js (포트 3000) 기본
# /legacy/* → Streamlit (포트 8501) — Next.js로 아직 마이그레이션 안 된 기능용
#
# 이전 버전과 호환: /m/* 경로도 그대로 Next.js로 (북마크 안 깨짐)

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name cocobiz.shop;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cocobiz.shop;

    # SSL 인증서 (certbot이 자동 관리)
    ssl_certificate     /etc/letsencrypt/live/cocobiz.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cocobiz.shop/privkey.pem;

    client_max_body_size 50M;

    # ── /legacy/* — Streamlit (마이그레이션 안 된 기능: 영수증, 정산매칭, 자동화 등) ──
    location /legacy/ {
        rewrite ^/legacy/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout    86400;
        proxy_send_timeout    86400;
        proxy_connect_timeout 86400;
    }

    # Streamlit websocket (legacy 경로용 — Streamlit 내부 경로 그대로 받음)
    location /_stcore/ {
        proxy_pass http://127.0.0.1:8501/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade   $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 86400;
    }

    # ── /m/* — 호환성: 기존 모바일 북마크 그대로 Next.js로 ──
    location /m/ {
        rewrite ^/m/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 그 외 전체 → Next.js ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout    86400;
        proxy_send_timeout    86400;
        proxy_connect_timeout 86400;
    }
}
